<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Country Explorer</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #ffffff;

    background:
        radial-gradient(
            circle at 20% 0%,
            #164d7d 0%,
            transparent 38%
        ),
        radial-gradient(
            circle at 90% 100%,
            #0b3150 0%,
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #020812,
            #061728
        );

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {
    width: min(1000px, 100%);

    background: rgba(7, 19, 34, 0.96);

    border: 1px solid rgba(255,255,255,0.10);

    border-radius: 24px;

    padding: 24px;

    box-shadow:
        0 25px 80px rgba(0,0,0,0.55);

    overflow: hidden;
}

.title {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 800;

    margin-bottom: 5px;
}

.subtitle {
    color: #8fa8be;

    margin-bottom: 24px;
}

.grid {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap: 15px;
}

.card {
    min-width: 0;

    background:
        rgba(255,255,255,0.055);

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-radius: 18px;

    padding: 20px;

    min-height: 135px;

    overflow: hidden;
}

.card-title {
    color: #8bc5ff;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 0.5px;

    margin-bottom: 12px;
}

.value {
    min-width: 0;

    font-size: 25px;

    font-weight: 700;

    line-height: 1.3;

    overflow-wrap: anywhere;
}

.info {
    margin-top: 8px;

    color: #8da4b9;

    font-size: 14px;

    line-height: 1.4;

    overflow-wrap: anywhere;
}

.gps-value {
    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 20px;

    white-space: normal;

    overflow-wrap: anywhere;
}

/* COUNTRY MAP */

.country-card {
    grid-column: 1 / -1;

    min-height: 470px;
}

.country-name {
    display: flex;

    align-items: center;

    gap: 12px;

    min-width: 0;

    font-size: 34px;

    font-weight: 800;

    margin-bottom: 15px;

    overflow-wrap: anywhere;
}

.flag {
    flex: 0 0 auto;

    font-size: 42px;
}

#countryMap {
    width: 100%;

    height: 330px;

    background:
        radial-gradient(
            circle,
            rgba(30,90,135,0.20),
            transparent 65%
        ),
        rgba(0,0,0,0.22);

    border:
        1px solid
        rgba(255,255,255,0.05);

    border-radius: 16px;

    display: flex;

    justify-content: center;
    align-items: center;

    overflow: hidden;

    position: relative;
}

#countryMap svg {
    width: 100%;
    height: 100%;

    display: block;
}

.country-shape {
    fill: rgba(52,166,255,0.50);

    stroke: #69c2ff;

    stroke-width: 1.3;

    vector-effect:
        non-scaling-stroke;
}

.country-shape:hover {
    fill: rgba(80,190,255,0.68);
}

/* BUTTON */

button {
    width: 100%;

    margin-top: 20px;

    padding: 15px 18px;

    border: 0;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #278fff,
            #126cd1
        );

    color: white;

    font-size: 17px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;
}

button:hover {
    filter: brightness(1.12);

    transform:
        translateY(-1px);
}

button:active {
    transform:
        translateY(1px);
}

/* STATUS */

.status {
    text-align: center;

    margin-top: 14px;

    color: #8fa8be;

    min-height: 20px;

    overflow-wrap: anywhere;
}

.status.success {
    color: #6fe0a0;
}

.status.error {
    color: #ff7777;
}

.loading {
    animation:
        pulse 1.15s infinite;
}

@keyframes pulse {
    50% {
        opacity: 0.35;
    }
}

/* MOBILE */

@media (max-width: 700px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 16px;

        border-radius: 20px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .country-card {
        grid-column: 1;
    }

    .country-name {
        font-size: 27px;
    }

    #countryMap {
        height: 260px;
    }

    .card {
        padding: 17px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        GPS Country Explorer
    </div>

    <div class="subtitle">
        GPS → Quốc gia → Bản đồ
    </div>

    <div class="grid">

        <!-- THỜI TIẾT -->

        <div class="card">

            <div class="card-title">
                ☀️ THỜI TIẾT
            </div>

            <div
                class="value"
                id="weather"
            >
                Đang tải...
            </div>

            <div
                class="info"
                id="temperature"
            >
                --
            </div>

        </div>


        <!-- THỜI GIAN -->

        <div class="card">

            <div class="card-title">
                🕐 THỜI GIAN
            </div>

            <div
                class="value"
                id="time"
            >
                --:--:--
            </div>

            <div
                class="info"
                id="date"
            >
                --/--/----
            </div>

        </div>


        <!-- GPS -->

        <div class="card">

            <div class="card-title">
                🛰️ GPS
            </div>

            <div
                class="value gps-value"
                id="gps"
            >
                Đang lấy...
            </div>

            <div
                class="info"
                id="accuracy"
            >
                --
            </div>

        </div>


        <!-- QUỐC GIA -->

        <div class="card">

            <div class="card-title">
                🌎 QUỐC GIA
            </div>

            <div
                class="value"
                id="country"
            >
                Đang xác định...
            </div>

            <div
                class="info"
                id="countryCode"
            >
                --
            </div>

        </div>


        <!-- BẢN ĐỒ -->

        <div class="card country-card">

            <div class="card-title">
                🗺️ ĐẤT NƯỚC BẠN ĐANG Ở
            </div>

            <div
                class="country-name"
                id="countryTitle"
            >
                <span class="loading">
                    Đang xác định...
                </span>
            </div>

            <div id="countryMap">
                <span class="loading">
                    Đang tải bản đồ...
                </span>
            </div>

        </div>

    </div>


    <button onclick="getLocation()">
        🛰️ Lấy lại vị trí GPS
    </button>


    <div
        class="status"
        id="status"
    >
        Đang xin quyền GPS...
    </div>

</div>


<script>

/* =========================================================
   CẤU HÌNH
========================================================= */

/*
 * Natural Earth 10m.
 *
 * Dữ liệu này chi tiết hơn 50m và 110m.
 */

const WORLD_GEOJSON_URL =
    "https://raw.githubusercontent.com/" +
    "nvkelso/natural-earth-vector/" +
    "master/geojson/" +
    "ne_10m_admin_0_countries_iso.geojson";


/*
 * Cache bản đồ.
 *
 * Sau khi tải lần đầu,
 * không tải lại mỗi lần GPS refresh.
 */

let worldGeoJSON = null;


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now = new Date();

    document.getElementById("time")
        .textContent =
        now.toLocaleTimeString("vi-VN");

    document.getElementById("date")
        .textContent =
        now.toLocaleDateString("vi-VN");
}

updateClock();

setInterval(updateClock, 1000);


/* =========================================================
   GPS
========================================================= */

function getLocation() {

    const status =
        document.getElementById("status");

    const map =
        document.getElementById("countryMap");


    document.getElementById("gps")
        .textContent =
        "Đang lấy...";


    document.getElementById("accuracy")
        .textContent =
        "--";


    document.getElementById("country")
        .textContent =
        "Đang xác định...";


    document.getElementById("countryCode")
        .textContent =
        "--";


    document.getElementById("countryTitle")
        .innerHTML =
        `
        <span class="loading">
            Đang xác định...
        </span>
        `;


    map.innerHTML =
        `
        <span class="loading">
            Đang tải bản đồ...
        </span>
        `;


    if (!navigator.geolocation) {

        status.textContent =
            "Trình duyệt không hỗ trợ GPS.";

        status.className =
            "status error";

        return;
    }


    status.textContent =
        "Đang lấy tọa độ GPS...";

    status.className =
        "status";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            /*
             * CHỈ HIỂN THỊ GPS.
             *
             * Không hiển thị địa chỉ.
             */

            document.getElementById("gps")
                .textContent =
                `${lat.toFixed(5)}, ${lon.toFixed(5)}`;


            document.getElementById("accuracy")
                .textContent =
                `Độ chính xác khoảng ${Math.round(accuracy)} m`;


            /*
             * Xác định quốc gia.
             */

            getCountry(lat, lon);


            /*
             * Lấy thời tiết.
             */

            getWeather(lat, lon);

        },

        function(error) {

            console.error(
                "GPS ERROR:",
                error
            );


            status.textContent =
                "Không lấy được GPS. Hãy cho phép quyền vị trí.";

            status.className =
                "status error";
        },

        {
            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 60000
        }
    );
}


/* =========================================================
   GPS → COUNTRY
========================================================= */

async function getCountry(lat, lon) {

    try {

        const url =
            "https://api.bigdatacloud.net/data/" +
            "reverse-geocode-client" +
            `?latitude=${encodeURIComponent(lat)}` +
            `&longitude=${encodeURIComponent(lon)}` +
            "&localityLanguage=vi";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Country API HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        const country =
            data.countryName;


        const code =
            String(
                data.countryCode || ""
            ).toUpperCase();


        if (
            !country ||
            code.length !== 2
        ) {

            throw new Error(
                "Không nhận được countryCode."
            );
        }


        showCountry(
            country,
            code
        );


    } catch(error) {

        console.warn(
            "BigDataCloud error:",
            error
        );


        /*
         * FALLBACK.
         *
         * Vẫn chỉ lấy country,
         * không dùng địa chỉ để hiển thị.
         */

        try {

            await getCountryFallback(
                lat,
                lon
            );

        } catch(fallbackError) {

            console.error(
                fallbackError
            );

            showCountryError();
        }
    }
}


/* =========================================================
   FALLBACK COUNTRY
========================================================= */

async function getCountryFallback(lat, lon) {

    const url =
        "https://nominatim.openstreetmap.org/reverse" +
        `?format=json` +
        `&lat=${encodeURIComponent(lat)}` +
        `&lon=${encodeURIComponent(lon)}` +
        "&zoom=3" +
        "&addressdetails=1";


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Fallback HTTP " +
            response.status
        );
    }


    const data =
        await response.json();


    const address =
        data.address || {};


    const country =
        address.country;


    const code =
        String(
            address.country_code || ""
        ).toUpperCase();


    if (
        !country ||
        code.length !== 2
    ) {

        throw new Error(
            "Fallback không có quốc gia."
        );
    }


    showCountry(
        country,
        code
    );
}


/* =========================================================
   SHOW COUNTRY
========================================================= */

function showCountry(country, code) {

    const flag =
        getFlag(code);


    document.getElementById("country")
        .textContent =
        `${flag} ${country}`;


    document.getElementById("countryCode")
        .textContent =
        `Mã quốc gia: ${code}`;


    document.getElementById("countryTitle")
        .innerHTML =
        `
        <span class="flag">
            ${flag}
        </span>

        <span>
            ${escapeHTML(country)}
        </span>
        `;


    document.getElementById("status")
        .textContent =
        "Đã xác định quốc gia.";

    document.getElementById("status")
        .className =
        "status success";


    /*
     * Dùng mã ISO để tìm polygon.
     */

    getCountryShape(code);
}


/* =========================================================
   COUNTRY ERROR
========================================================= */

function showCountryError() {

    document.getElementById("country")
        .textContent =
        "Không xác định";


    document.getElementById("countryCode")
        .textContent =
        "Không nhận được mã quốc gia";


    document.getElementById("countryTitle")
        .textContent =
        "Không xác định";


    document.getElementById("countryMap")
        .textContent =
        "Không tải được bản đồ quốc gia.";


    document.getElementById("status")
        .textContent =
        "Không xác định được quốc gia.";

    document.getElementById("status")
        .className =
        "status error";
}


/* =========================================================
   FLAG
========================================================= */

function getFlag(code) {

    if (
        !code ||
        code.length !== 2
    ) {
        return "🌍";
    }


    return code
        .split("")
        .map(letter => {

            return String.fromCodePoint(
                127397 +
                letter.charCodeAt(0)
            );

        })
        .join("");
}


/* =========================================================
   LOAD WORLD GEOJSON
========================================================= */

async function loadWorldGeoJSON() {

    if (worldGeoJSON) {

        return worldGeoJSON;
    }


    const response =
        await fetch(
            WORLD_GEOJSON_URL
        );


    if (!response.ok) {

        throw new Error(
            "Không tải được GeoJSON. HTTP " +
            response.status
        );
    }


    worldGeoJSON =
        await response.json();


    return worldGeoJSON;
}


/* =========================================================
   GET COUNTRY SHAPE
========================================================= */

async function getCountryShape(code) {

    const map =
        document.getElementById("countryMap");


    map.innerHTML =
        `
        <span class="loading">
            Đang tải bản đồ chi tiết...
        </span>
        `;


    try {

        const world =
            await loadWorldGeoJSON();


        /*
         * Tìm ISO_A2.
         *
         * Một số bản dữ liệu có thể dùng
         * ISO_A2 hoặc iso_a2.
         */

        const feature =
            world.features.find(feature => {

                const p =
                    feature.properties || {};


                const iso =
                    String(
                        p.ISO_A2 ||
                        p.iso_a2 ||
                        ""
                    ).toUpperCase();


                return (
                    iso ===
                    code.toUpperCase()
                );
            });


        if (!feature) {

            throw new Error(
                "Không tìm thấy quốc gia " +
                code
            );
        }


        drawCountry(
            feature.geometry
        );


    } catch(error) {

        console.error(
            "MAP ERROR:",
            error
        );


        map.innerHTML =
            `
            <span>
                Không tải được bản đồ quốc gia.
            </span>
            `;
    }
}


/* =========================================================
   DRAW COUNTRY
========================================================= */

function drawCountry(geometry) {

    const container =
        document.getElementById("countryMap");


    container.innerHTML = "";


    const svg =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );


    svg.setAttribute(
        "viewBox",
        "0 0 1000 650"
    );


    svg.setAttribute(
        "preserveAspectRatio",
        "xMidYMid meet"
    );


    /*
     * Polygon:
     *
     * [ring, ring, ...]
     *
     * MultiPolygon:
     *
     * [[ring...], [ring...]]
     */

    let polygons = [];


    if (
        geometry.type === "Polygon"
    ) {

        polygons = [
            geometry.coordinates
        ];

    } else if (
        geometry.type === "MultiPolygon"
    ) {

        polygons =
            geometry.coordinates;

    } else {

        container.textContent =
            "Geometry không được hỗ trợ.";

        return;
    }


    /*
     * Lấy toàn bộ tọa độ.
     *
     * KHÔNG loại bỏ polygon nhỏ.
     *
     * Vì polygon nhỏ có thể là đảo.
     */

    const points = [];


    for (
        const polygon of polygons
    ) {

        for (
            const ring of polygon
        ) {

            for (
                const point of ring
            ) {

                points.push(point);
            }
        }
    }


    if (
        points.length === 0
    ) {

        container.textContent =
            "Không có dữ liệu hình dạng.";

        return;
    }


    /* =====================================
       BOUNDING BOX
    ====================================== */

    let minLon = Infinity;
    let maxLon = -Infinity;

    let minLat = Infinity;
    let maxLat = -Infinity;


    for (
        const [lon, lat] of points
    ) {

        if (lon < minLon)
            minLon = lon;

        if (lon > maxLon)
            maxLon = lon;

        if (lat < minLat)
            minLat = lat;

        if (lat > maxLat)
            maxLat = lat;
    }


    const width =
        maxLon - minLon || 1;


    const height =
        maxLat - minLat || 1;


    /* =====================================
       FIT
    ====================================== */

    const padding = 50;


    const targetWidth =
        1000 - padding * 2;


    const targetHeight =
        650 - padding * 2;


    const scale =
        Math.min(
            targetWidth / width,
            targetHeight / height
        );


    const drawnWidth =
        width * scale;


    const drawnHeight =
        height * scale;


    const offsetX =
        (1000 - drawnWidth) / 2;


    const offsetY =
        (650 - drawnHeight) / 2;


    /* =====================================
       DRAW ALL POLYGONS AND ISLANDS
    ====================================== */

    for (
        const polygon of polygons
    ) {

        for (
            const ring of polygon
        ) {

            if (
                !ring ||
                ring.length === 0
            ) {
                continue;
            }


            let d = "";


            for (
                let i = 0;
                i < ring.length;
                i++
            ) {

                const [
                    lon,
                    lat
                ] = ring[i];


                const x =
                    offsetX +
                    (lon - minLon) *
                    scale;


                const y =
                    offsetY +
                    (maxLat - lat) *
                    scale;


                if (i === 0) {

                    d +=
                        `M ${x.toFixed(2)} ${y.toFixed(2)}`;

                } else {

                    d +=
                        ` L ${x.toFixed(2)} ${y.toFixed(2)}`;
                }
            }


            d += " Z";


            const path =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );


            path.setAttribute(
                "d",
                d
            );


            path.setAttribute(
                "class",
                "country-shape"
            );


            svg.appendChild(path);
        }
    }


    container.appendChild(svg);
}


/* =========================================================
   WEATHER
========================================================= */

async function getWeather(lat, lon) {

    try {

        const url =
            "https://api.open-meteo.com/v1/forecast" +
            `?latitude=${encodeURIComponent(lat)}` +
            `&longitude=${encodeURIComponent(lon)}` +
            "&current=" +
            "temperature_2m," +
            "weather_code," +
            "relative_humidity_2m," +
            "wind_speed_10m" +
            "&timezone=auto";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Weather HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        const current =
            data.current;


        document.getElementById("weather")
            .textContent =
            getWeatherText(
                current.weather_code
            );


        document.getElementById("temperature")
            .textContent =
            `${current.temperature_2m}°C` +
            ` | Độ ẩm ${current.relative_humidity_2m}%` +
            ` | Gió ${current.wind_speed_10m} km/h`;


    } catch(error) {

        console.error(
            "WEATHER ERROR:",
            error
        );


        document.getElementById("weather")
            .textContent =
            "Không có dữ liệu";


        document.getElementById("temperature")
            .textContent =
            "--";
    }
}


/* =========================================================
   WEATHER CODE
========================================================= */

function getWeatherText(code) {

    if (code === 0)
        return "☀️ Trời quang";

    if ([1,2,3].includes(code))
        return "🌤️ Có mây";

    if ([45,48].includes(code))
        return "🌫️ Sương mù";

    if ([51,53,55,56,57].includes(code))
        return "🌦️ Mưa phùn";

    if ([61,63,65,66,67].includes(code))
        return "🌧️ Mưa";

    if ([71,73,75,77].includes(code))
        return "❄️ Tuyết";

    if ([80,81,82].includes(code))
        return "🌦️ Mưa rào";

    if ([95,96,99].includes(code))
        return "⛈️ Dông";

    return "🌍 Không xác định";
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   START
